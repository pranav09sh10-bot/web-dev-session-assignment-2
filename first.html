<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Async Weather Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* -------- GLOBAL RESET -------- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

/* -------- BODY BACKGROUND -------- */
body {
    height: 100vh;
    background: linear-gradient(to top, #87ceeb, #e6f7ff);
    overflow-x: hidden;
    position: relative;
    animation: lightning 8s infinite;
}

/* -------- CLOUD BASE -------- */
body::before,
body::after {
    content: "";
    position: absolute;
    width: 120px;
    height: 60px;
    background: #ffffffcc;
    border-radius: 50px;
    filter: blur(2px);
    opacity: 0.85;
}

/* -------- CLOUD 1 -------- */
body::before {
    top: 60px;
    left: -400px;
    animation: moveClouds 40s linear infinite;

    box-shadow:
        30px 0px 0px #ffffffcc,
        70px 5px 0px #ffffffcc,
        20px -8px 0px #ffffffcc;
}

/* -------- CLOUD 2 -------- */
body::after {
    top: 140px;
    left: -300px;
    animation: moveClouds 55s linear infinite;

    box-shadow:
        50px 0px 0px #ffffffcc,
        100px 15px 0px #ffffffcc,
        30px -12px 0px #ffffffcc;
}

/* -------- CLOUD ANIMATION -------- */
@keyframes moveClouds {
    from {
        transform: translateX(0);
    }
    to {
        transform: translateX(140vw);
    }
}


/* -------- CONTAINER -------- */
.container {
    text-align: center;
    padding: 30px;
    color: #333;
}

/* -------- TITLE -------- */
h1 {
    color: #ffcc00;
    text-shadow: 2px 2px 10px #ffffff;
    margin-bottom: 30px;
}

/* -------- CARD LAYOUT -------- */
.parent-card {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
}

/* -------- CARD STYLE -------- */
.card {
    background: rgba(255, 255, 255, 0.85);
    border-radius: 16px;
    padding: 20px;
    width: 300px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    backdrop-filter: blur(10px);
    transition: 0.3s ease;
}

.card:hover {
    transform: translateY(-6px);
}

/* -------- INPUT GROUP -------- */
.input-group {
    display: flex;
    gap: 10px;
}

/* -------- INPUT -------- */
input {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    outline: none;
    transition: 0.3s;
}

input:focus {
    border-color: #87ceeb;
    box-shadow: 0 0 6px #87ceeb;
}

/* -------- BUTTON -------- */
button {
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(to right, #ffcc00, #ffdd33);
    color: #333;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: linear-gradient(to right, #ffd633, #ffee66);
    transform: scale(1.05);
}

/* -------- WEATHER INFO -------- */
.weather-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #ddd;
}

.weather-item label {
    color: #555;
}

.weather-item span {
    font-weight: bold;
    color: #333;
}

/* -------- HISTORY -------- */
.history {
    margin-top: 10px;
}

.history span {
    display: inline-block;
    background: #e6f7ff;
    padding: 6px 12px;
    margin: 5px;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.3s;
}

.history span:hover {
    background: #87ceeb;
    color: white;
}

/* -------- RESPONSIVE -------- */
@media (max-width: 768px) {
    .parent-card {
        flex-direction: column;
        align-items: center;
    }
}
    </style>
</head>

<body>
    <div class="container">

        <h1>🌤 Async Weather Tracker</h1>

        <div class="parent-card">
            <div class="card">
                <h3>Search City</h3>
                <div class="input-group">
                    <input id="cityInput" placeholder="Meerut, India">
                    <button id="searchBtn">Search</button>
                </div>
                <br>
                <br>
                <h3>Search History</h3>
                <div class="history" id="history"></div>
            </div>
            

            <div class="card">
                <h3>Weather Info</h3>
                <div id="weather"></div>
            </div>
        </div>

        <!-- <div class="card">
            <h3>Console – Event Loop</h3>
            <div class="console" id="console"></div>
        </div> -->

    </div>

    <script>
        const API_KEY = "67ac385865b212c44a181b824a115883";
        //    const API_KEY = "af9f63c59a649f27d602b96a43d0bd14";

        const weatherBox = document.getElementById("weather");
        const historyBox = document.getElementById("history");

        /* ---------- WEATHER FETCH ---------- */
        async function getWeather(city) {

            // small delay for smoother UI
            // await new Promise(r => setTimeout(r, 500));

            const res = await fetch(
                `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`
            );
            if (!res.ok) {
                alert("city not found");
                throw new Error("City not found");
            }
            const data = await res.json();
            return data;
        }

         /* ---------- BUTTON CLICK ---------- */
        document.getElementById("searchBtn").onclick = () => {
            const city = cityInput.value.trim();
            if (city) {
                search(city);
            }
        };

        /* ---------- UI RENDER ---------- */
        function renderWeather(d) {
            weatherBox.innerHTML = `
        <div class="weather-item"><label>City</label><span>${d.name}, ${d.sys.country}</span></div>
        <div class="weather-item"><label>Temperature</label><span>${d.main.temp} °C</span></div>
        <div class="weather-item"><label>Weather</label><span>${d.weather[0].main}</span></div>
        <div class="weather-item"><label>Humidity</label><span>${d.main.humidity}%</span></div>
        <div class="weather-item"><label>Wind Speed</label><span>${d.wind.speed} m/s</span></div>
    `;
        }

        /* ---------- SAVE SEARCH HISTORY ---------- */
        function saveHistory(city) {
            
        }

        /* ---------- SHOW HISTORY ---------- */
        function showHistory() {
           
        }

        /* ---------- SEARCH FUNCTION ---------- */
        async function search(city) {
            weatherBox.innerHTML = "";
            try {
                const data = await getWeather(city);
                renderWeather(data);
                saveHistory(data.name); 
            } catch (error) {
                weatherBox.innerHTML = `<p style="color:red">${error.message}</p>`;
            }
        }
       
        /* ---------- ENTER KEY SEARCH ---------- */
        cityInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                const city = cityInput.value.trim();
                if (city) {
                    search(city);
                }
            }
        });
        /* ---------- INITIAL LOAD ---------- */
        showHistory();

function saveHistory(city) {
    // 1. Read the saved list (or empty array if nothing saved yet)
    let history = JSON.parse(localStorage.getItem("weatherHistory") || "[]");

    // 2. Add the new city at the start
    history.unshift(city);

    // 3. Save the updated list back
    localStorage.setItem("weatherHistory", JSON.stringify(history));

    // 4. Refresh what's shown on screen
    showHistory();
}

function showHistory() {
    // 1. Read the saved list
    let history = JSON.parse(localStorage.getItem("weatherHistory") || "[]");

    // 2. For each city, make a button and show it
    historyBox.innerHTML = "";
    history.forEach(function(city) {
        let btn = document.createElement("button");
        btn.textContent = city;
        btn.onclick = function() { search(city); };
        historyBox.appendChild(btn);
    });
}
    </script>
</body>

</html>
